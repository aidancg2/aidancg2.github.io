<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@5.20.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "data": {"name": "data-d6c9eeb1fa276bc8c180066dfa93e19e"}, "mark": {"type": "bar"}, "encoding": {"color": {"field": "sightings", "scale": {"scheme": "blues"}, "title": "Sightings", "type": "quantitative"}, "tooltip": [{"field": "state", "title": "State", "type": "nominal"}, {"field": "sightings", "title": "Sightings", "type": "quantitative"}], "x": {"field": "sightings", "title": "Number of Sightings", "type": "quantitative"}, "y": {"field": "state", "sort": "-x", "title": "State", "type": "nominal"}}, "height": 400, "title": "Top 15 States with Bigfoot Sightings", "width": 600, "$schema": "https://vega.github.io/schema/vega-lite/v5.20.1.json", "datasets": {"data-d6c9eeb1fa276bc8c180066dfa93e19e": [{"state": "Washington", "sightings": 563}, {"state": "California", "sightings": 402}, {"state": "Florida", "sightings": 292}, {"state": "Ohio", "sightings": 276}, {"state": "Oregon", "sightings": 241}, {"state": "Illinois", "sightings": 232}, {"state": "Texas", "sightings": 215}, {"state": "Michigan", "sightings": 208}, {"state": "Missouri", "sightings": 141}, {"state": "Georgia", "sightings": 121}, {"state": "Colorado", "sightings": 121}, {"state": "Kentucky", "sightings": 112}, {"state": "Pennsylvania", "sightings": 111}, {"state": "New York", "sightings": 102}, {"state": "West Virginia", "sightings": 100}]}};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
